syntax = "proto3";

package fixtures.v1;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
  COLOR_GREEN = 2;
}

message Scalars {
  double f_double = 1;
  float f_float = 2;
  int32 f_int32 = 3;
  int64 f_int64 = 4;
  uint32 f_uint32 = 5;
  uint64 f_uint64 = 6;
  sint32 f_sint32 = 7;
  sint64 f_sint64 = 8;
  fixed32 f_fixed32 = 9;
  fixed64 f_fixed64 = 10;
  sfixed32 f_sfixed32 = 11;
  sfixed64 f_sfixed64 = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
  Color f_enum = 16;
}

message Nested {
  message Inner {
    string name = 1;
    Inner child = 2;
  }
  string title = 1;
  Inner inner = 2;
  repeated Inner items = 3;
}

message Maps {
  map<string, string> labels = 1;
  map<int32, Nested.Inner> by_id = 2;
  map<bool, int64> flags = 3;
  map<uint64, Color> colors = 4;
}

message Repeated {
  repeated int32 packed_ints = 1;
  repeated double packed_doubles = 2;
  repeated sint64 packed_zigzag = 3;
  repeated int32 unpacked_ints = 4 [packed = false];
  repeated string names = 5;
  repeated Color colors = 6;
  repeated bytes blobs = 7;
}

message Oneofs {
  oneof choice {
    string text = 1;
    int64 number = 2;
    Nested.Inner inner = 3;
  }
  string other = 4;
}

message Optionals {
  optional int32 maybe_int = 1;
  optional string maybe_string = 2;
  optional bool maybe_bool = 3;
  int32 plain_int = 4;
}

message WellKnown {
  google.protobuf.Timestamp ts = 1;
  google.protobuf.Duration dur = 2;
  google.protobuf.FieldMask mask = 3;
  google.protobuf.Struct st = 4;
  google.protobuf.Value val = 5;
  google.protobuf.ListValue list = 6;
  google.protobuf.DoubleValue w_double = 7;
  google.protobuf.FloatValue w_float = 8;
  google.protobuf.Int64Value w_int64 = 9;
  google.protobuf.UInt64Value w_uint64 = 10;
  google.protobuf.Int32Value w_int32 = 11;
  google.protobuf.UInt32Value w_uint32 = 12;
  google.protobuf.BoolValue w_bool = 13;
  google.protobuf.StringValue w_string = 14;
  google.protobuf.BytesValue w_bytes = 15;
  google.protobuf.Any any = 16;
  google.protobuf.Empty empty = 17;
  google.protobuf.Any any_wkt = 18;
}
